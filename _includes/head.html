  <style>

    /* VARIABLES (Design statutaire) */
    :root {
      --bg-light: #FAFAFA;
      --bg-alt: #F0F4F8; 
      --surface: #FFFFFF;
      --text-main: #0A192F;
      --text-muted: #4A5568;
      --border: #E2E8F0;
      
      --bg-dark: #0A192F;
      --text-dark: #FAFAFA;
      --text-dark-muted: #A0AEC0;
      --border-dark: rgba(255, 255, 255, 0.1);
      
      --accent-gold: #D4AF37; 
      --accent-emerald: #2A9D8F; 
      --success: #2A9D8F;
      --warning: #E07A5F;

      --header-height: 88px;
      --max: 1100px; 
      --radius: 2px; 
      --shadow: 0 4px 20px rgba(10, 25, 47, 0.05); 
      
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Lora', serif;
      --font-ui: 'Inter', sans-serif; 
    }

    [data-theme="dark"] {
      --bg-light: #060F1E; 
      --bg-alt: #0A192F; 
      --surface: #112240; 
      --text-main: #E2E8F0;
      --text-muted: #8892B0;
      --border: #233554;
      --accent-emerald: #4FD1C5; 
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--header-height); }
    body {
      margin: 0; font-family: var(--font-body); color: var(--text-main);
      background: var(--bg-light); line-height: 1.7; transition: background 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, h4 { font-family: var(--font-heading); color: var(--text-main); font-weight: 700; transition: color 0.3s ease; }
    a { color: inherit; text-decoration: none; transition: color 0.2s ease; }
    img { display: block; max-width: 100%; }
    .container { width: min(var(--max), calc(100% - 2rem)); margin: 0 auto; }

    /* Navigation */
    .topbar {
      position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
      background: rgba(10, 25, 47, 0.95); border-bottom: 1px solid var(--border-dark); color: var(--text-dark);
    }
    .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; font-family: var(--font-ui); }
    .brand { display: flex; align-items: center; gap: .85rem; font-weight: 600; letter-spacing: .02em; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: var(--radius); overflow: hidden;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-dark);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .nav-links { display: flex; align-items: center; gap: 0.9rem; color: var(--text-dark-muted); font-size: 0.82rem; flex-wrap: wrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--text-dark); }
    .nav-links a.active { border-bottom: 2px solid var(--accent-gold); padding-bottom: 2px; }
    .topbar .btn-secondary { background: var(--accent-gold) !important; color: #0A192F !important; border-color: var(--accent-gold) !important; }

    /* Controls */
    .controls-wrapper { display: flex; align-items: center; gap: 0.25rem; margin-left: 0.75rem; }
    .lang-switch { display: flex; align-items: center; gap: 0.5rem; }
    .lang-btn {
      display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid transparent; background: transparent; color: var(--text-dark); cursor: pointer; transition: all .2s ease;
      font-size: 1rem; padding: 0; filter: grayscale(80%);
    }
    .lang-btn:hover { filter: grayscale(0%); background: rgba(255,255,255,0.1); }
    .lang-btn.active { filter: grayscale(0%); border-color: var(--border-dark); background: rgba(255,255,255,0.05); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 1rem;
      border-radius: var(--radius); font-weight: 500; font-family: var(--font-ui); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
      transition: all .2s ease; border: 1px solid transparent; cursor: pointer;
    }
    .btn:hover { transform: translateY(-1px); }

    .btn-secondary {
      background: transparent; color: var(--accent-gold); border-color: var(--accent-gold);
    }
    .btn-secondary:hover {
      background: var(--accent-gold); color: var(--bg-dark); border-color: var(--accent-gold);
    }

    .topbar .btn-secondary {
      background: var(--accent-gold); color: #0A192F; border-color: var(--accent-gold);
    }
    .topbar .btn-secondary:hover {
      background: #b8972e;
    }
@media (max-width: 980px) {
      .hero-grid, .grid-3, .grid-2 { grid-template-columns: 1fr; }
