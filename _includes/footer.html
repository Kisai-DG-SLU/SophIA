        <a href="mailto:contact@kisai.fr">contact@kisai.fr</a>

  <script>
    const commonTranslations = {
      fr: {
    meta: { title: "SophIA — L'architecture IA souveraine & open-source" },
    nav: { problem: "Le Piège", solution: "Le Bunker", architecture: "Ingénierie", posture: "Ma Posture", author: "L'Architecte", book: "Le Livre", contact: "Contact", github: "Code (GitHub)" },
    footer: { copy: "© 2026 SophIA / Damien Guesdon", github: "GitHub" },
      },
      en: {
    meta: { title: "SophIA — Sovereign & Open-Source AI Architecture" },
    nav: { problem: "The Trap", solution: "The Bunker", architecture: "Engineering", posture: "My Posture", author: "The Architect", book: "The Book", contact: "Contact", github: "Code (GitHub)" },
    footer: { copy: "© 2026 SophIA / Damien Guesdon", github: "GitHub" },
      }
    };

    if (typeof pageTranslations !== "undefined") {
      for (const lang of ["fr", "en"]) {
        if (pageTranslations[lang]) {
          Object.assign(commonTranslations[lang], pageTranslations[lang]);
        }
      }
    }

    const translations = commonTranslations;

function getNestedValue(obj, path) { return path.split('.').reduce((acc, key) => acc && acc[key] !== undefined ? acc[key] : null, obj); }
    function applyLanguage(lang) {
      const dict = translations[lang] || translations.en;
      document.documentElement.lang = lang; document.title = dict.meta.title;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const value = getNestedValue(dict, el.getAttribute('data-i18n'));
        if (value !== null) el.innerHTML = value;
      });
      document.querySelectorAll('.lang-switch .lang-btn').forEach(btn => {
        const isActive = btn.dataset.lang === lang;
        btn.classList.toggle('active', isActive); btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      localStorage.setItem('sophia-lang', lang);
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('sophia-theme', theme);
      const toggleBtn = document.getElementById('theme-toggle'); if (toggleBtn) toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyLanguage(localStorage.getItem('sophia-lang') || (navigator.language.startsWith('fr') ? 'fr' : 'en'));
      document.querySelectorAll('.lang-switch .lang-btn').forEach(btn => btn.addEventListener('click', () => applyLanguage(btn.dataset.lang)));
      applyTheme(localStorage.getItem('sophia-theme') || 'light');
      document.getElementById('theme-toggle')?.addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    });
  </script>
